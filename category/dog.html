<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корм для собак</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <h1>Корм для собак</h1>
    <hr>
    <p><a href="../index.html" style="text-decoration: none; color: #48bb78; font-weight: bold;">← Повернутися на головну</a></p>

    <div class="products-grid">
        <!-- Товар 1 -->
        <div class="product-card">
            <img src="../img/dog_food_1.jpg" alt="Сухий корм для собак" class="product-image">
            <div class="product-info">
                <span class="product-title">Сухий корм з ягням (3 кг)</span>
            </div>
            <p style="margin-bottom: 15px; font-weight: bold; color: #2c3e50;">620 грн</p>
            <button class="select-button">Купити</button>
        </div>

        <!-- Товар 2 -->
        <div class="product-card">
            <img src="../img/dog_food_2.jpg" alt="Консерва для собак" class="product-image">
            <div class="product-info">
                <span class="product-title">М'ясна консерва (400г)</span>
            </div>
            <p style="margin-bottom: 15px; font-weight: bold; color: #2c3e50;">85 грн</p>
            <button class="select-button">Купити</button>
        </div>

        <!-- Товар 3 -->
        <div class="product-card">
            <img src="../img/dog_food_3.jpg" alt="Корм для великих порід" class="product-image">
            <div class="product-info">
                <span class="product-title">Корм для великих порід (10 кг)</span>
            </div>
            <p style="margin-bottom: 15px; font-weight: bold; color: #2c3e50;">1850 грн</p>
            <button class="select-button">Купити</button>
        </div>
    </div>
</body>
</html>
