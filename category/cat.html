<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корм для котів</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <h1>Корм для котів</h1>
    <hr>
    <p><a href="../index.html" style="text-decoration: none; color: #48bb78; font-weight: bold;">← Повернутися на головну</a></p>

    <div class="products-grid">
        <!-- Товар 1 -->
        <div class="product-card">
            <img src="../img/cat_food_1.jpg" alt="Сухий корм для котів" class="product-image">
            <div class="product-info">
                <span class="product-title">Сухий корм з куркою (2 кг)</span>
            </div>
            <p style="margin-bottom: 15px; font-weight: bold; color: #2c3e50;">450 грн</p>
            <button class="select-button">Купити</button>
        </div>

        <!-- Товар 2 -->
        <div class="product-card">
            <img src="../img/cat_food_2.jpg" alt="Вологий корм для котів" class="product-image">
            <div class="product-info">
                <span class="product-title">Вологий корм (пауч 85г)</span>
            </div>
            <p style="margin-bottom: 15px; font-weight: bold; color: #2c3e50;">32 грн</p>
            <button class="select-button">Купити</button>
        </div>

        <!-- Товар 3 -->
        <div class="product-card">
            <img src="../img/cat_food_3.jpg" alt="Корм для кошенят" class="product-image">
            <div class="product-info">
                <span class="product-title">Корм для кошенят (1.5 кг)</span>
            </div>
            <p style="margin-bottom: 15px; font-weight: bold; color: #2c3e50;">380 грн</p>
            <button class="select-button">Купити</button>
        </div>
    </div>
</body>
</html>
