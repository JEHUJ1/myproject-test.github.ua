<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>
        Ласкаво просимо до нашого магазину! 
    </h1>
    <hr>
    <p>
        Для якої тваринки ви хочете замовити корм?<br>
        Виберіть категорію, яка у вас тварина:
    </p>

    <div class="products-grid">
        <!-- Картка 1: Коти (Перший у списку) -->
        <div class="product-card">
            <img src="img/сat.jpg" alt="Коти" class="product-image">
            <div class="product-info">
                <span class="product-title">Коти</span>
            </div>
            <button class="select-button">Вибрати</button>
        </div>

        <!-- Картка 2: Собаки -->
        <div class="product-card">
            <img src="img/dog.jpg" alt="Собаки" class="product-image">
            <div class="product-info">
                <span class="product-title">Собаки</span>
            </div>
            <button class="select-button">Вибрати</button>
        </div>

        <!-- Картка 3: Гризуни (хом'яки, кролики, морські свинки) -->
        <div class="product-card">
            <img src="img/rodents.png" alt="Гризуни" class="product-image">
            <div class="product-info">
                <span class="product-title">Гризуни</span>
            </div>
            <button class="select-button">Вибрати</button>
        </div>

        <!-- Картка 4: Птахи (папуги, канарки) -->
        <div class="product-card">
            <img src="img/birds.jpg" alt="Птахи" class="product-image">
            <div class="product-info">
                <span class="product-title">Птахи</span>
            </div>
            <button class="select-button">Вибрати</button>
        </div>

        <!-- Картка 5: Рибки -->
        <div class="product-card">
            <img src="img/fish.jpg" alt="Рибки" class="product-image">
            <div class="product-info">
                <span class="product-title">Рибки</span>
            </div>
            <button class="select-button">Вибрати</button>
        </div>

        <!-- Картка 6: Рептилії -->
        <div class="product-card">
            <img src="img/reptiles.jpg" alt="Рептилії" class="product-image">
            <div class="product-info">
                <span class="product-title">Рептилії</span>
            </div>
            <button class="select-button">Вибрати</button>
        </div>
    </div>
</body>
</html>
